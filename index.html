<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIワークアウトプランナー | あなた専用の筋トレメニュー</title>
  <meta name="description" content="体重・身長・目的・使える器具から、AIがあなたに最適な1週間の筋トレメニューを提案します。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=8">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <h1 class="logo"><span class="logo-en">AI WORKOUT</span><span class="logo-ja">プランナー</span></h1>
    </div>
    <p class="tagline">体格・目的・使える器具から、あなた専用の1週間メニューを作成</p>
  </header>

  <main>
    <form id="menu-form" class="panel" novalidate>
      <h2 class="panel-title">プロフィール入力</h2>

      <div class="field-grid">
        <label class="field">
          <span>体重 (kg)</span>
          <select id="weight"></select>
        </label>
        <label class="field">
          <span>身長 (cm)</span>
          <select id="height"></select>
        </label>
        <label class="field">
          <span>年齢</span>
          <select id="age"></select>
        </label>
        <label class="field">
          <span>性別</span>
          <select id="gender">
            <option value="男性">男性</option>
            <option value="女性">女性</option>
            <option value="その他・回答しない">その他・回答しない</option>
          </select>
        </label>
        <label class="field">
          <span>目的</span>
          <select id="goal">
            <option value="hypertrophy">筋肥大(筋肉を大きくしたい)</option>
            <option value="cut">減量・引き締め</option>
            <option value="strength">筋力・体力向上</option>
            <option value="health">健康維持</option>
          </select>
        </label>
        <label class="field">
          <span>経験レベル</span>
          <select id="level">
            <option value="beginner">初心者(〜1年)</option>
            <option value="intermediate">中級者(1〜3年)</option>
            <option value="advanced">上級者(3年以上)</option>
          </select>
        </label>
        <label class="field">
          <span>週のトレーニング頻度</span>
          <select id="frequency">
            <option value="1">週1回</option>
            <option value="2">週2回</option>
            <option value="3" selected>週3回</option>
            <option value="4">週4回</option>
            <option value="5">週5回</option>
            <option value="6">週6回</option>
            <option value="7">週7回</option>
          </select>
        </label>
      </div>

      <div class="field focus-field">
        <span>特に鍛えたい部位 <small>(任意・複数選択可)</small></span>
        <div id="focus-chips" class="focus-chips"></div>
      </div>

      <h2 class="panel-title">使える器具・施設 <small>(複数選択可・未選択なら自重のみ)</small></h2>
      <div id="preset-buttons" class="preset-bar"></div>
      <div id="equipment-groups" class="equipment-groups"></div>

      <p id="form-error" class="error-msg" role="alert"></p>
      <button type="submit" id="generate-btn" class="primary-btn">メニュー作成</button>
    </form>

    <section class="panel" id="log-section">
      <h2 class="panel-title">トレーニング記録 <small>(記録するとメニュー生成に反映されます)</small></h2>
      <form id="log-form" novalidate>
        <div class="log-date-wrap">
          <label class="field log-date-field">
            <span>日付</span>
            <input type="date" id="log-date">
          </label>
          <div class="date-quick">
            <button type="button" class="preset-btn" data-days-ago="0">今日</button>
            <button type="button" class="preset-btn" data-days-ago="1">昨日</button>
          </div>
        </div>
        <div id="log-entries"></div>
        <button type="button" id="log-add-row" class="secondary-btn">+ 種目を追加</button>
        <p id="log-error" class="error-msg" role="alert"></p>
        <button type="submit" class="primary-btn log-save-btn">この内容で記録する</button>
      </form>
      <div id="log-list" class="log-list"></div>
    </section>
    <datalist id="exercise-names"></datalist>

    <section id="result-section" class="panel" hidden>
      <div class="result-header">
        <h2 class="panel-title">あなたの1週間メニュー</h2>
      </div>
      <div id="result-content" class="result-content"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>本アプリの提案は一般的なフィットネス情報であり、医療アドバイスではありません。持病のある方は医師に相談してください。</p>
  </footer>

  <script type="module" src="js/app.js?v=8"></script>
</body>
</html>
