<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AIワークアウトプランナー | あなた専用の筋トレメニュー</title>
  <meta name="description" content="体格・目的・使える器具から、あなた専用の1週間の筋トレメニューを作成。記録・休憩タイマー・進捗グラフまで、端末の中だけで動作します。">
  <meta name="theme-color" content="#111319">
  <meta name="color-scheme" content="dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ワークアウト">
  <link rel="preload" href="fonts/bebas-neue-latin-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css?v=14">
  <link rel="stylesheet" href="session.css?v=14">
</head>
<body>
  <header class="app-bar">
    <div class="app-bar-inner">
      <p class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
          <rect width="32" height="32" rx="9" fill="#cbf24f"/>
          <g fill="none" stroke="#12140f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 16h18M10 12v8M13 10v12M19 10v12M22 12v8"/>
          </g>
        </svg>
        <span class="brand-name"><span class="brand-en" lang="en">AI WORKOUT</span><span class="brand-ja">プランナー</span></span>
      </p>
      <button type="button" id="app-reload" class="icon-btn app-bar-btn" aria-label="アプリを再読み込み" hidden><span data-icon="refresh"></span></button>
    </div>
  </header>

  <main id="main" class="app-main">
    <noscript><p class="notice">このアプリを使うには JavaScript を有効にしてください。</p></noscript>
    <div id="notices" class="notices"></div>

    <section id="view-menu" class="view" aria-labelledby="menu-title" hidden>
      <header class="view-head">
        <h1 id="menu-title" class="view-title" tabindex="-1">メニュー</h1>
        <p class="view-sub"></p>
      </header>
      <div class="view-body"></div>
    </section>

    <section id="view-log" class="view" aria-labelledby="log-title" hidden>
      <header class="view-head">
        <h1 id="log-title" class="view-title" tabindex="-1">記録</h1>
        <p class="view-sub"></p>
      </header>
      <div class="view-body"></div>
    </section>

    <section id="view-progress" class="view" aria-labelledby="progress-title" hidden>
      <header class="view-head">
        <h1 id="progress-title" class="view-title" tabindex="-1">進捗</h1>
        <p class="view-sub"></p>
      </header>
      <div class="view-body"></div>
    </section>

    <section id="view-settings" class="view" aria-labelledby="settings-title" hidden>
      <header class="view-head">
        <h1 id="settings-title" class="view-title" tabindex="-1">設定</h1>
        <p class="view-sub"></p>
      </header>
      <div class="view-body"></div>
    </section>
  </main>

  <div id="rest-timer" class="rest-timer" hidden role="timer" aria-label="休憩タイマー">
    <div class="rest-timer-track" aria-hidden="true"><div class="rest-timer-bar"></div></div>
    <div class="rest-timer-main">
      <span class="rest-timer-label" aria-hidden="true">休憩</span>
      <span id="rest-timer-time" class="rest-timer-time">0:00</span>
    </div>
    <div class="rest-timer-actions">
      <button type="button" class="rest-mini" data-rest="+15">+15秒</button>
      <button type="button" class="rest-mini" data-rest="+60">+1分</button>
      <button type="button" class="rest-mini" data-rest="reset">リセット</button>
      <button type="button" class="rest-mini rest-close" data-rest="stop">終了</button>
    </div>
    <span class="rest-timer-live sr-only" aria-live="polite"></span>
  </div>

  <nav class="tab-bar" aria-label="画面の切り替え">
    <a class="tab" href="#menu" data-tab="menu"><span class="tab-ico" data-icon="dumbbell"></span><span class="tab-label">メニュー</span></a>
    <a class="tab" href="#log" data-tab="log"><span class="tab-ico" data-icon="clipboard"></span><span class="tab-label">記録</span></a>
    <a class="tab" href="#progress" data-tab="progress"><span class="tab-ico" data-icon="chart"></span><span class="tab-label">進捗</span></a>
    <a class="tab" href="#settings" data-tab="settings"><span class="tab-ico" data-icon="sliders"></span><span class="tab-label">設定</span></a>
  </nav>

  <div id="toast-region" class="toast-region"></div>
  <p id="sr-status" class="sr-only" role="status" aria-live="polite"></p>

  <dialog id="sheet" class="sheet" aria-labelledby="sheet-title">
    <div class="sheet-inner">
      <header class="sheet-head">
        <h2 id="sheet-title" class="sheet-title" tabindex="-1"></h2>
        <button type="button" class="icon-btn sheet-close" aria-label="閉じる"><span data-icon="close"></span></button>
      </header>
      <div class="sheet-body"></div>
      <footer class="sheet-foot"></footer>
    </div>
  </dialog>

  <script type="module" src="js/app.js?v=14"></script>
</body>
</html>
