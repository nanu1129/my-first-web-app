<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マナビット | 応用情報技術者試験の学習サイト</title>
  <meta name="description" content="応用情報技術者試験の学習サイト「マナビット」。教材で学び、一問一答で確認し、本番レベル演習で仕上げる段階式カリキュラム。模擬試験・午後演習・暗記カード・間隔反復・学習計画つき。">
  <meta name="theme-color" content="#FAF9F6">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="マナビット">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=M+PLUS+1+Code:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=14">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="logo" href="#" id="logo-link">
        <span class="logo-mark">マ</span>
        <span class="logo-text">マナビット<small>応用情報技術者試験 対策</small></span>
      </a>
      <div class="header-tools">
        <div class="sync-wrap">
          <button class="theme-btn" id="sync-btn" aria-label="端末間の同期" title="端末間の同期"></button>
          <div class="sync-panel" id="sync-panel" hidden></div>
        </div>
        <button class="theme-btn" id="theme-toggle" aria-label="ライト/ダークテーマの切替え" title="テーマ切替え"></button>
      </div>
      <nav class="tabs" id="main-nav">
        <button class="tab is-active" data-nav="home">学習</button>
        <button class="tab" data-nav="practice">実践</button>
        <button class="tab" data-nav="exam">模試</button>
        <button class="tab" data-nav="cards">カード</button>
        <button class="tab" data-nav="stats">成績</button>
      </nav>
    </div>
  </header>

  <main id="main">
    <!-- ホーム: コースマップ -->
    <section class="view" id="view-home"></section>

    <!-- ユニット学習(教材) -->
    <section class="view" id="view-lesson" hidden></section>

    <!-- クイズ(一問一答 / 本番レベル演習 / 模試 共通) -->
    <section class="view" id="view-quiz" hidden></section>

    <!-- 実践トレーニング(計算ドリル/トレース/午後演習) -->
    <section class="view" id="view-practice" hidden></section>

    <!-- 模擬試験の設定 -->
    <section class="view" id="view-exam" hidden></section>

    <!-- 用語カード -->
    <section class="view" id="view-cards" hidden></section>

    <!-- 成績 -->
    <section class="view" id="view-stats" hidden></section>
  </main>

  <footer class="site-footer">
    <p>本番レベル演習・模擬試験の問題は、IPA(独立行政法人 情報処理推進機構)応用情報技術者試験の午前試験の出題傾向をもとに作成した学習用のオリジナル問題です。
      本物の過去問題と解答は <a href="https://www.ipa.go.jp/shiken/" target="_blank" rel="noopener">IPA 公式サイト</a> で公開されています。本サイトはIPAとは関係のない非公式の学習教材です。</p>
    <p>学習の記録は端末内(localStorage)に保存されます。ヘッダの同期ボタンからGoogleでログインすると、PCとスマホなど複数の端末で共有できます。</p>
  </footer>
